<title id="title">插件同步 IMA 文字到 Obsidian，用户另行配置 Agent 分析</title>
<desc id="desc">插件同步 IMA 文字到 Obsidian，用户另行配置 Agent 分析. Conceptual workflow illustration, not a screenshot or actual analysis result.</desc>
<rect x="0" y="0" width="1200" height="464" rx="20" fill="#1B1A20" stroke="none"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="53" font-size="16" fill="#C9B1FA" font-weight="600">从资料，到自己的分析</text><text x="52" y="104" font-size="36" fill="#F3F0F8" font-weight="600">同步很简单，用法由你决定。</text><text x="52" y="172" font-size="15" fill="#93859F" font-weight="400">01</text><text x="52" y="216" font-size="30" fill="#E7DDED" font-weight="600">他人的 IMA 分享</text><text x="52" y="254" font-size="18" fill="#CBC7D4" font-weight="400">有权访问和保存的文字文章</text><text x="52" y="307" font-size="18" fill="#A69DAF" font-weight="400">选择知识库与文件夹</text><text x="439" y="172" font-size="15" fill="#93859F" font-weight="400">02</text><text x="439" y="216" font-size="30" fill="#E7DDED" font-weight="600">本地 Markdown</text><text x="439" y="254" font-size="18" fill="#CBC7D4" font-weight="400">保存在 Obsidian 中</text><text x="439" y="307" font-size="18" fill="#A69DAF" font-weight="400">标注 · 检索 · 保留原文</text><text x="826" y="172" font-size="15" fill="#93859F" font-weight="400">03</text><text x="826" y="216" font-size="30" fill="#B7D6BE" font-weight="600">你的 Agent</text><text x="826" y="254" font-size="18" fill="#CBC7D4" font-weight="400">按你的问题，分析已有资料</text><text x="826" y="307" font-size="18" fill="#A69DAF" font-weight="400">趋势对比 · 变化简报 · 写作提纲</text><path d="M354 210L410 210" fill="none" stroke="#8B829C" stroke-width="2"/><path d="m403 204 7 6-7 6" stroke="#8B829C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M741 210L797 210" fill="none" stroke="#8B829C" stroke-width="2" stroke-dasharray="5 6"/><path d="m790 204 7 6-7 6" stroke="#8B829C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 347L724 347" fill="none" stroke="#B69BDD" stroke-width="2"/><path d="M826 347L1148 347" fill="none" stroke="#9DB8A5" stroke-width="2" stroke-dasharray="6 5"/><text x="52" y="384" font-size="15" fill="#C9B1FA" font-weight="600">插件提供：文字同步</text><text x="826" y="384" font-size="15" fill="#B7D6BE" font-weight="600">自行配置：AI 与自动分析</text><text x="52" y="434" font-size="14" fill="#9D94AC" font-weight="400">流程示意 · 分析结果保留来源，原文与分析分开存放</text></g>
