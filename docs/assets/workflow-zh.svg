<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title"><title id="title">检查七篇，跳过五篇，保存两篇</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17151F"/><stop offset="1" stop-color="#222032"/></linearGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F4FE"/><stop offset="1" stop-color="#E5DEF5"/></linearGradient></defs><rect x="0" y="0" width="1200" height="610" rx="24" fill="url(#bg)" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="54" font-size="14" fill="#B6A0ED" font-weight="600">一个真实的使用场景</text><text x="52" y="108" font-size="38" fill="#F7F3FD" font-weight="650">检查 7 篇，不是重复保存 7 篇。</text><text x="52" y="149" font-size="20" fill="#B9B0C5" font-weight="400">默认不覆盖：已有来源跳过，新内容成为自己的笔记。</text><rect x="52" y="198" width="298" height="335" rx="18" fill="#242030" stroke="#3B334B"/><text x="77" y="238" font-size="16" fill="#9586B1" font-weight="400">01</text><text x="77" y="275" font-size="24" fill="#EAE3F5" font-weight="600">IMA 最近 7 篇</text><rect x="77" y="299" width="244" height="21" rx="5" fill="#463759" stroke="none"/><circle cx="91" cy="309" r="4" fill="#D1BBFF"/><text x="103" y="314" font-size="13" fill="#E5D5FF" font-weight="400">新文章</text><rect x="77" y="328" width="244" height="21" rx="5" fill="#463759" stroke="none"/><circle cx="91" cy="338" r="4" fill="#D1BBFF"/><text x="103" y="343" font-size="13" fill="#E5D5FF" font-weight="400">新文章</text><rect x="77" y="357" width="244" height="21" rx="5" fill="#2D273B" stroke="none"/><circle cx="91" cy="367" r="4" fill="#6F647F"/><text x="103" y="372" font-size="13" fill="#A49AAF" font-weight="400">已保存</text><rect x="77" y="386" width="244" height="21" rx="5" fill="#2D273B" stroke="none"/><circle cx="91" cy="396" r="4" fill="#6F647F"/><text x="103" y="401" font-size="13" fill="#A49AAF" font-weight="400">已保存</text><rect x="77" y="415" width="244" height="21" rx="5" fill="#2D273B"