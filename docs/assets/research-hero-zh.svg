<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">将别人通过 IMA 分享的文章，保存为获准保留的本地副本，供自己的 Agent 分析</title>
<desc id="desc">将别人通过 IMA 分享的文章，保存为获准保留的本地副本，供自己的 Agent 分析. Conceptual workflow illustration, not a screenshot or actual analysis result.</desc>
<rect x="0" y="0" width="1200" height="530" rx="20" fill="#1B1A20" stroke="none"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="53" font-size="17" fill="#C9B1FA" font-weight="600">IMA SHARE SYNC</text><text x="52" y="96" font-size="13" fill="#A7A1B3" font-weight="600">从别人的分享，到自己的本地研究库</text><text x="50" y="179" font-size="43" fill="#F3F0F8" font-weight="600">别人分享的好资料。</text><text x="50" y="248" font-size="43" fill="#CAB0FE" font-weight="600">留在你的研究库。</text><text x="52" y="304" font-size="21" fill="#CBC7D4" font-weight="400">IMA 分享文章 → Obsidian 本地 Markdown</text><text x="52" y="340" font-size="20" fill="#AAA4B6" font-weight="400">保留本地副本，交给自己的 Agent 分析。</text><text x="52" y="441" font-size="18" fill="#B5ACBF" font-weight="500">金融投研   /   竞品跟踪   /   内容创作</text><rect x="655" y="113" width="488" height="304" rx="12" fill="#24222C" stroke="#403849"/><text x="681" y="152" font-size="16" fill="#B6A5CF" font-weight="600">你的研究资料库</text><path d="M682 213L1113 213" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="187" r="4" fill="#B8D9BE"/><text x="708" y="193" font-size="20" fill="#E8E6EE" font-weight="400">行业简报 · 今天.md</text><path d="M682 263L1113 263" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="237" r="4" fill="#8E79B5"/><text x="708" y="243" font-size="20" fill="#B6AEC2" font-weight="400">公司研究 · 7 天前.md</text><path d="M682 313L1113 313" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="287" r="4" fill="#8E79B5"/><text x="708" y="293" font-size="20" fill="#B6AEC2" font-weight="400">研究笔记 · 30 天前.md</text><path d="M690 367L1099 367" fill="none" stroke="#645276" stroke-width="2"/><circle cx="690" cy="367" r="4" fill="#BB9BFF"/><circle cx="797" cy="367" r="4" fill="#BB9BFF"/><circle cx="902" cy="367" r="4" fill="#BB9BFF"/><circle cx="1099" cy="367" r="4" fill="#BB9BFF"/><text x="680" y="398" font-size="15" fill="#D1BDD9" font-weight="400">昨天</text><text x="785" y="398" font-size="15" fill="#D1BDD9" font-weight="400">7 天</text><text x="885" y="398" font-size="15" fill="#D1BDD9" font-weight="400">30 天</text><text x="1078" y="398" font-size="15" fill="#D1BDD9" font-weight="400">1 年</text><path d="M52 470L1148 470" fill="none" stroke="#37343F" stroke-width="2"/><text x="52" y="503" font-size="15" fill="#9D94AC" font-weight="400">仅保存获准内容 · 本地副本不改变版权归属 · Agent 分析需另行配置</text></g>
</svg>
