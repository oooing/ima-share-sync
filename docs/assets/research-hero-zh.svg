<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">留下别人分享的好资料，交给自己配置的本地 AI 分析</title>
<desc id="desc">留下别人分享的好资料，交给自己配置的本地 AI 分析. 资料积累示意，非实际分析结果。</desc>
<rect x="0" y="0" width="1200" height="530" rx="20" fill="#1B1A20" stroke="none"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="53" font-size="17" fill="#C9B1FA" font-weight="600">IMA SHARE SYNC</text><text x="52" y="96" font-size="13" fill="#A7A1B3" font-weight="600">少做复制 · 方便回看</text><text x="50" y="179" font-size="43" fill="#F3F0F8" font-weight="600">资料留得住</text><text x="50" y="248" font-size="43" fill="#CAB0FE" font-weight="600">想用时找得到</text><text x="52" y="304" font-size="21" fill="#CBC7D4" font-weight="400">IMA 文章与原文件 → Obsidian</text><text x="52" y="340" font-size="20" fill="#AAA4B6" font-weight="400">留好原文，再交给自己的本地 AI。</text><text x="52" y="441" font-size="18" fill="#B5ACBF" font-weight="500">跟踪研报   /   观察竞品   /   准备写作</text><rect x="655" y="113" width="488" height="304" rx="12" fill="#24222C" stroke="#403849"/><text x="681" y="152" font-size="16" fill="#B6A5CF" font-weight="600">你的资料</text><path d="M682 213L1113 213" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="187" r="4" fill="#B8D9BE"/><text x="708" y="193" font-size="20" fill="#E8E6EE" font-weight="400">行业简报 · 今天</text><path d="M682 263L1113 263" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="237" r="4" fill="#8E79B5"/><text x="708" y="243" font-size="20" fill="#B6AEC2" font-weight="400">公司研报 · 7 天前</text><path d="M682 313L1113 313" fill="none" stroke="#35303E" stroke-width="2"/><circle cx="689" cy="287" r="4" fill="#8E79B5"/><text x="708" y="293" font-size="20" fill="#B6AEC2" font-weight="400">研究笔记 · 30 天前</text><path d="M690 367L1099 367" fill="none" stroke="#645276" stroke-width="2"/><circle cx="690" cy="367" r="4" fill="#BB9BFF"/><circle cx="797" cy="367" r="4" fill="#BB9BFF"/><circle cx="902" cy="367" r="4" fill="#BB9BFF"/><circle cx="1099" cy="367" r="4" fill="#BB9BFF"/><text x="680" y="398" font-size="15" fill="#D1BDD9" font-weight="400">昨天</text><text x="785" y="398" font-size="15" fill="#D1BDD9" font-weight="400">7 天</text><text x="885" y="398" font-size="15" fill="#D1BDD9" font-weight="400">30 天</text><text x="1078" y="398" font-size="15" fill="#D1BDD9" font-weight="400">1 年</text><path d="M52 470L1148 470" fill="none" stroke="#37343F" stroke-width="2"/><text x="52" y="503" font-size="15" fill="#9D94AC" font-weight="400">只保存获准资料 · 本地 AI 需另行配置</text></g>
</svg>
