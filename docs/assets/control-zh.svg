<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title"><title id="title">同步前可知情，同步后可追溯</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17151F"/><stop offset="1" stop-color="#222032"/></linearGradient><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#F7F4FE"/><stop offset="1" stop-color="#E5DEF5"/></linearGradient></defs><rect x="0" y="0" width="1200" height="590" rx="24" fill="url(#bg)" stroke="none"/><g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="54" font-size="14" fill="#B6A0ED" font-weight="600">少打扰，但每一步有交代</text><text x="52" y="109" font-size="37" fill="#F6F1FF" font-weight="650">你来决定何时开始，记录随时可查。</text><rect x="52" y="154" width="350" height="360" rx="18" fill="#242030" stroke="#3B334B"/><text x="76" y="194" font-size="16" fill="#A995CC" font-weight="400">01</text><rect x="425" y="154" width="350" height="360" rx="18" fill="#242030" stroke="#3B334B"/><text x="449" y="194" font-size="16" fill="#A995CC" font-weight="400">02</text><rect x="798" y="154" width="350" height="360" rx="18" fill="#242030" stroke="#3B334B"/><text x="822" y="194" font-size="16" fill="#A995CC" font-weight="400">03</text><text x="76" y="238" font-size="26" fill="#F1EBFA" font-weight="600">手动同步</text><text x="76" y="278" font-size="19" fill="#BDB1CE" font-weight="400">点击后立即开始</text><rect x="77" y="314" width="298" height="63" rx="12" fill="#C6B0F4" stroke="none"/><text x="139" y="352" font-size="22" fill="#292035" font-weight="600">立即同步  →</text><text x="77" y="423" font-size="17" fill="#AFA1C1" font-weight="400">首次使用需授权</text><text x="77" y="458" font-size="17" fill="#AFA1C1" font-weight="400">运行中随时停止</text><text x="449" y="238" font-size="26" fill="#F1EBFA" font-weight="600">启动时自动同步</text><text x="449" y="278" font-size="19" fill="#BDB1CE" font-weight="400">默认关闭，由你开启</text><text x="449" y="365" font-size="60" fill="#CFB7FF" font-weight="600">5s</text><text x="543" y="348" font-size="21" fill="#E3D2FD" font-weight="400">开始前提醒</text><text x="543" y="376" font-size="15" fill="#AFA1C1" font-weight="400">默认倒计时</text><text x="449" y="423" font-size="17" fill="#C9B6E0" font-weight="400">立即开始 · 推迟 · 取消</text><text x="449" y="458" font-size="17" fill="#AFA1C1" font-weight="400">避免电脑突然自己操作</text><text x="822" y="238" font-size="26" fill="#F1EBFA" font-weight="600">完整同步日志</text><text x="822" y="278" font-size="18" fill="#BDB1CE" font-weight="400">有异常，直接找到原因</text><rect x="822" y="310" width="301" height="89" rx="10" fill="#31263B" stroke="none"/><circle cx="843" cy="338" r="4" fill="#E6BA87"/><text x="859" y="344" font-size="19" fill="#ECD1AC" font-weight="500">存在异常</text><text x="841" y="375" font-size="17" fill="#C4AEDE" font-weight="400">查看原因  →</text><text x="822" y="443" font-size="17" fill="#AFA1C1" font-weight="400">已读消标记，日志仍保留</text><text x="822" y="470" font-size="17" fill="#AFA1C1" font-weight="400">20 条 / 页 · 随时回看</text><text x="53" y="562" font-size="13" fill="#968AA5" font-weight="500">交互流程示意 · 并非软件截图 · 提醒可在设置中关闭</text></g></svg>
