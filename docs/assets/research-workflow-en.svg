<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="464" viewBox="0 0 1200 464" role="img" aria-labelledby="title desc">
<title id="title">The plugin syncs IMA text to Obsidian; agent analysis is configured separately</title>
<desc id="desc">The plugin syncs IMA text to Obsidian; agent analysis is configured separately. Conceptual workflow illustration, not a screenshot or actual analysis result.</desc>
<rect x="0" y="0" width="1200" height="464" rx="20" fill="#1B1A20" stroke="none"/>
<g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif"><text x="52" y="53" font-size="16" fill="#C9B1FA" font-weight="600">FROM SOURCES TO YOUR OWN ANALYSIS</text><text x="52" y="104" font-size="36" fill="#F3F0F8" font-weight="600">Simple sync. Your choice of workflow.</text><text x="52" y="172" font-size="15" fill="#93859F" font-weight="400">01</text><text x="52" y="216" font-size="30" fill="#E7DDED" font-weight="600">Others' IMA articles</text><text x="52" y="254" font-size="18" fill="#CBC7D4" font-weight="400">Text you may access and save</text><text x="52" y="307" font-size="16" fill="#A69DAF" font-weight="400">Choose a knowledge base and folder</text><text x="439" y="172" font-size="15" fill="#93859F" font-weight="400">02</text><text x="439" y="216" font-size="30" fill="#E7DDED" font-weight="600">Local Markdown</text><text x="439" y="254" font-size="18" fill="#CBC7D4" font-weight="400">Stored in your Obsidian vault</text><text x="439" y="307" font-size="16" fill="#A69DAF" font-weight="400">Annotate · Search · Keep sources</text><text x="826" y="172" font-size="15" fill="#93859F" font-weight="400">03</text><text x="826" y="216" font-size="30" fill="#B7D6BE" font-weight="600">Your agent</text><text x="826" y="254" font-size="18" fill="#CBC7D4" font-weight="400">Analyze notes on your terms</text><text x="826" y="307" font-size="16" fill="#A69DAF" font-weight="400">Compare · Investigate · Draft</text><path d="M354 210L410 210" fill="none" stroke="#8B829C" stroke-width="2"/><path d="m403 204 7 6-7 6" stroke="#8B829C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M741 210L797 210" fill="none" stroke="#8B829C" stroke-width="2" stroke-dasharray="5 6"/><path d="m790 204 7 6-7 6" stroke="#8B829C" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 347L724 347" fill="none" stroke="#B69BDD" stroke-width="2"/><path d="M826 347L1148 347" fill="none" stroke="#9DB8A5" stroke-width="2" stroke-dasharray="6 5"/><text x="52" y="384" font-size="15" fill="#C9B1FA" font-weight="600">INCLUDED: TEXT SYNC</text><text x="826" y="384" font-size="13" fill="#B7D6BE" font-weight="600">YOUR SETUP: AI + AUTOMATION</text><text x="52" y="434" font-size="12" fill="#9D94AC" font-weight="400">WORKFLOW ILLUSTRATION · CITE SOURCES AND KEEP ANALYSIS SEPARATE FROM ORIGINALS</text></g>
</svg>
